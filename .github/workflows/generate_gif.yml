name: Generate Demo GIF

on:
  workflow_dispatch:

jobs:
  generate:
    name: Convert WebM to GIF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify video existence
        run: |
          if [ ! -f demos/videos/admin_chat_demo.webm ]; then
            echo "::error::Demo video not found at demos/videos/admin_chat_demo.webm"
            exit 1
          fi

      - name: Convert WebM to GIF
        run: |
          ffmpeg -y -i demos/videos/admin_chat_demo.webm \
            -vf "fps=10,scale=800:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
            demos/admin_demo.gif

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-demo-gif
          path: demos/admin_demo.gif
          if-no-files-found: error
