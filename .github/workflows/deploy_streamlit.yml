name: Deploy to Streamlit

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run pre-deployment tests
        run: pytest -q

      - name: Trigger Streamlit deploy webhook
        if: ${{ secrets.STREAMLIT_DEPLOY_HOOK }}
        env:
          HOOK: ${{ secrets.STREAMLIT_DEPLOY_HOOK }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          echo "Triggering Streamlit deploy webhook for ${REPO} (${SHA})"
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"repo\": \"${REPO}\", \"ref\": \"${REF}\", \"sha\": \"${SHA}\"}" \
            "$HOOK"
