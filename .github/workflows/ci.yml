name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch: {}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-mock pytest-cov

      - name: Run tests with coverage
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest --cov=app tests/ --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  health-check:
    name: Provider Health Check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run provider health checks
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/run_health_checks.py

      - name: Read health results
        id: read_results
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results_file = Path('health_results.json')
          if not results_file.exists():
              print("No health results found.")
              exit(0)
          
          results = json.loads(results_file.read_text(encoding='utf-8'))
          failing = {name: info for name, info in results.items() if not info.get('ok', False)}
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"results={json.dumps(results)}\n")
              f.write(f"has_failures={'true' if failing else 'false'}\n")
          PY

      - name: Create issue for failing providers
        if: steps.read_results.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS || '{}');
            const failing = Object.entries(results).filter(([, v]) => v && v.ok === false);
            if (failing.length === 0) return;

            const bodyLines = ['### 🚨 Provider Health Check Failures','', 'The scheduled health check detected the following issues:', ''];
            for (const [name, info] of failing) {
              bodyLines.push(`- **${name}**: ${info.reason || 'Unknown error'} ${info.detail ? `(\`${info.detail}\`)` : ''}`);
            }
            bodyLines.push('', '---', '_Generated by GitHub Actions_');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Provider Health Check Failures: ${failing.map(f=>f[0]).join(', ')}`,
              body: bodyLines.join('\n')
            });
        env:
          RESULTS: ${{ steps.read_results.outputs.results }}
